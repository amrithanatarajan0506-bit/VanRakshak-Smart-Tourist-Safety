services:
  - type: web
    name: vanrakshak-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./vanrakshak.db
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        value: LWFmK3ESmbfvxtvR1MbOpVG_u_TpJkkffqcVMtj9W6Y=
      - key: STAFF_USERNAME
        value: vanrakshak
      - key: STAFF_PASSWORD
        value: Vanrakshak@123
      - key: ALLOW_DEMO_CREDENTIALS
        value: "true"

  - type: web
    name: vanrakshak-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vanrakshak-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_WS_URL
        fromService:
          type: web
          name: vanrakshak-api
          envVarKey: RENDER_EXTERNAL_URL
